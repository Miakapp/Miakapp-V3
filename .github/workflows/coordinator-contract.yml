name: Coordinator contract

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/coordinator-contract.yml'
      - 'coordinator-contract/**'
      - 'synthetic-home/**'
      - 'docs/rfcs/0001-wire-protocol.md'
      - 'docs/rfcs/0003-coordinator-sdk-and-migration.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/coordinator-contract.yml'
      - 'coordinator-contract/**'
      - 'synthetic-home/**'
      - 'docs/rfcs/0001-wire-protocol.md'
      - 'docs/rfcs/0003-coordinator-sdk-and-migration.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: coordinator-contract
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Run SDK surface, replay, and shadow-safety checks
        run: ./check.sh

  windows-platform-guard:
    name: Reject unsupported Windows execution before spawn
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        working-directory: coordinator-contract
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - name: Verify the external runner fails before spawning on Windows
        run: npm run test:external-platform
