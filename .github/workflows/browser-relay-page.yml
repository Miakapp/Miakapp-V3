name: Browser relay page

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/browser-relay-page.yml'
      - 'infrastructure/staging/browser-relay-page/**'
      - 'infrastructure/staging/test/browser-relay-page*.mjs'
      - 'infrastructure/staging/test/helpers/browser-relay-page-*.mjs'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/browser-relay-page.yml'
      - 'infrastructure/staging/browser-relay-page/**'
      - 'infrastructure/staging/test/browser-relay-page*.mjs'
      - 'infrastructure/staging/test/helpers/browser-relay-page-*.mjs'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  three-engine-dormant-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run the closed page and artifact contracts
        run: node --test infrastructure/staging/test/browser-relay-page.test.mjs
      - name: Install the three pinned browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Exercise the offline page lifecycle in three browsers
        run: node infrastructure/staging/test/browser-relay-page-browser.mjs
