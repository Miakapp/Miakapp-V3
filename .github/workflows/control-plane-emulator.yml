name: Control-plane Firebase Emulator slice

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/control-plane-emulator.yml'
      - 'control-plane/**'
      - 'control-plane-contract/**'
      - 'docs/rfcs/0004-platform-control-plane.md'
      - 'docs/rfcs/0005-browser-client-sdk.md'
      - 'docs/operations/2026-09-04-browser-relay-integration.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/control-plane-emulator.yml'
      - 'control-plane/**'
      - 'control-plane-contract/**'
      - 'docs/rfcs/0004-platform-control-plane.md'
      - 'docs/rfcs/0005-browser-client-sdk.md'
      - 'docs/operations/2026-09-04-browser-relay-integration.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Run the isolated Firebase Emulator slice
        run: ./check.sh

  relay-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the control plane under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check out the pinned relay
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Miakapp/Miakapp-Server
          ref: da49e8bf6b1bd03acaabd225ab5e96a61dd5dd91
          path: .integration/miakapp-server
      - name: Check out the pinned MiakAPI coordinator SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Miakapp/MiakAPI
          ref: 5c26eaa830015d94f53bf05fbbb0f5ebda6d290f
          path: .integration/miakapi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: .integration/miakapp-server/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Build the control plane under test
        working-directory: control-plane
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build the pinned MiakAPI coordinator SDK
        working-directory: .integration/miakapi
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install the pinned Chromium runtime
        working-directory: .integration/miakapi
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run the Home Key to relay authentication integration
        working-directory: .integration/miakapp-server
        run: >-
          ./scripts/check-platform-integration.sh
          "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/.integration/miakapi"
      - name: Run the real browser relay integration
        working-directory: .integration/miakapp-server
        run: >-
          ./scripts/check-miakapi-integration.sh
          "$GITHUB_WORKSPACE/.integration/miakapi"
