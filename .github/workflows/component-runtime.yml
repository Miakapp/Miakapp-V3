name: Component runtime contract

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/component-runtime.yml'
      - 'component-runtime/**'
      - 'docs/rfcs/0002-component-runtime.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/component-runtime.yml'
      - 'component-runtime/**'
      - 'docs/rfcs/0002-component-runtime.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: component-runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Run unit contract
        run: bun run test:unit
      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Run hostile browser corpus
        run: bun run test:browser
