name: Component runtime contract

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/component-runtime.yml'
      - 'component-runtime/**'
      - 'docs/rfcs/0002-component-runtime.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/component-runtime.yml'
      - 'component-runtime/**'
      - 'docs/rfcs/0002-component-runtime.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: component-runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Run unit contract
        run: bun run test:unit
      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Run hostile browser corpus
        run: bun run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: component-runtime-failure-evidence-attempt-${{ github.run_attempt }}
          path: component-runtime/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The unit contract proves the builder is correct for a given broker source.
  # It cannot prove that bundling the real broker still yields a document the
  # browser will execute: the CSP hash covers the escaped script text, so a
  # change in what esbuild emits can break the artifact while every test stays
  # green. This builds it for throwaway origins and re-derives the digest from
  # the bytes that would be served.
  sandbox-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIAKAPP_SANDBOX_ORIGIN: https://sandbox.invalid
      MIAKAPP_HOST_ORIGIN: https://host.invalid
      MIAKAPP_SANDBOX_SITE: miakapp-sandbox-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # esbuild resolves from the package that owns the build script.
      - name: Install component runtime dependencies
        working-directory: component-runtime
        run: bun install --frozen-lockfile
      - name: Build the sandbox artifact
        run: bun run build:sandbox
      - name: Verify the served bytes against the declared policy
        run: bun run verify:sandbox
