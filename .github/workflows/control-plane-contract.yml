name: Control-plane contract

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/control-plane-contract.yml'
      - 'control-plane-contract/**'
      - 'docs/rfcs/0004-platform-control-plane.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/control-plane-contract.yml'
      - 'control-plane-contract/**'
      - 'docs/rfcs/0004-platform-control-plane.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: control-plane-contract/go/go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Run cross-language and behavioral conformance
        run: ./control-plane-contract/check.sh
