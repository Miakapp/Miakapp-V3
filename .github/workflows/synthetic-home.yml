name: Synthetic home conformance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/synthetic-home.yml'
      - 'synthetic-home/**'
      - 'docs/specs/2026-08-29-miakapp-3.5-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-3.5-coordination.md'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/synthetic-home.yml'
      - 'synthetic-home/**'
      - 'docs/specs/2026-08-29-miakapp-3.5-design.md'
      - 'docs/roadmaps/2026-08-29-miakapp-3.5-coordination.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: synthetic-home
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Run fixture contract, replay, and privacy checks
        run: ./check.sh
