name: Publish control-plane image

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/src/**'
      - 'control-plane/package.json'
      - 'control-plane/bun.lock'
      - 'control-plane/Dockerfile'
      - '.github/workflows/control-plane-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repository allowlist excludes the docker/* actions; the runner's
      # own Docker CLI does the same job.
      - name: Build and publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/miakapp/miakapp-control-plane
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --platform linux/amd64 -t "$IMAGE:edge" -t "$IMAGE:sha-$GITHUB_SHA" control-plane
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:edge"
