name: Protocol conformance

on:
  pull_request:
    paths:
      - '.github/workflows/protocol.yml'
      - 'docs/rfcs/**'
      - 'protocol/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/protocol.yml'
      - 'docs/rfcs/**'
      - 'protocol/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: protocol/go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Run both conformance implementations
        run: ./protocol/check.sh
      - name: Smoke-test the Go fuzz target
        working-directory: protocol/go
        run: go test -run '^$' -fuzz '^FuzzDecodeFrame$' -fuzztime=10s
