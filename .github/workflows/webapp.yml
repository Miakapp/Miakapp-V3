name: Webapp trusted host

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/webapp.yml'
      - 'src/**'
      - 'component-runtime/src/contract.ts'
      - 'index.html'
      - 'eslint.config.mjs'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/webapp.yml'
      - 'src/**'
      - 'component-runtime/src/contract.ts'
      - 'index.html'
      - 'eslint.config.mjs'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint, type-check, test, and build
        run: bun run check:web
