name: Node-RED adapter

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/node-red-adapter.yml'
      - 'node-red-adapter/**'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
  pull_request:
    paths:
      - '.github/workflows/node-red-adapter.yml'
      - 'node-red-adapter/**'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'

permissions:
  contents: read

jobs:
  characterization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: node-red-adapter
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - name: Characterize the v3 node against a real Node-RED runtime
        run: ./check.sh
