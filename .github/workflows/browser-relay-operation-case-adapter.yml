name: Browser relay operation case adapter

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/browser-relay-operation-case-adapter.yml'
      - 'package.json'
      - 'bun.lock'
      - 'infrastructure/staging/browser-relay/**'
      - 'infrastructure/staging/browser-relay-edge/**'
      - 'infrastructure/staging/browser-relay-operation/**'
      - 'infrastructure/staging/browser-relay-orchestrator/**'
      - 'infrastructure/staging/browser-relay-runner/**'
      - 'infrastructure/staging/browser-relay-case-scheduler/**'
      - 'infrastructure/staging/browser-relay-evidence-session/**'
      - 'infrastructure/staging/browser-relay-independent-case-adapter/**'
      - 'infrastructure/staging/browser-relay-independent-observers/**'
      - 'infrastructure/staging/browser-relay-operation-case-adapter/**'
      - 'infrastructure/staging/browser-relay-secondary-case-adapter/**'
      - 'infrastructure/staging/test/browser-relay-operation-case-adapter.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/browser-relay-operation-case-adapter.yml'
      - 'package.json'
      - 'bun.lock'
      - 'infrastructure/staging/browser-relay/**'
      - 'infrastructure/staging/browser-relay-edge/**'
      - 'infrastructure/staging/browser-relay-operation/**'
      - 'infrastructure/staging/browser-relay-orchestrator/**'
      - 'infrastructure/staging/browser-relay-runner/**'
      - 'infrastructure/staging/browser-relay-case-scheduler/**'
      - 'infrastructure/staging/browser-relay-evidence-session/**'
      - 'infrastructure/staging/browser-relay-independent-case-adapter/**'
      - 'infrastructure/staging/browser-relay-independent-observers/**'
      - 'infrastructure/staging/browser-relay-operation-case-adapter/**'
      - 'infrastructure/staging/browser-relay-secondary-case-adapter/**'
      - 'infrastructure/staging/test/browser-relay-operation-case-adapter.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    name: Browser relay operation case adapter / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEBUG: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate claim-bound operation composition
        run: |
          node infrastructure/staging/browser-relay-operation-case-adapter/guard.mjs infrastructure/staging/browser-relay-operation-case-adapter
          node --test infrastructure/staging/test/browser-relay-operation-case-adapter.test.mjs
