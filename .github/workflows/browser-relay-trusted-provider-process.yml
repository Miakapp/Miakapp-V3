name: Browser relay trusted provider process

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/browser-relay-trusted-provider-process.yml'
      - 'package.json'
      - 'bun.lock'
      - 'infrastructure/staging/browser-relay-operation/**'
      - 'infrastructure/staging/browser-relay-runner/**'
      - 'infrastructure/staging/browser-relay-trusted-provider-process/**'
      - 'infrastructure/staging/browser-relay-trusted-source-composition/**'
      - 'infrastructure/staging/manifest/**'
      - 'infrastructure/staging/manifest.json'
      - 'infrastructure/staging/manifest-bundle.mjs'
      - 'infrastructure/staging/check.sh'
      - 'infrastructure/staging/validate.mjs'
      - 'infrastructure/staging/test/validate.test.mjs'
      - 'infrastructure/staging/README.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'
  pull_request:
    paths:
      - '.github/workflows/browser-relay-trusted-provider-process.yml'
      - 'package.json'
      - 'bun.lock'
      - 'infrastructure/staging/browser-relay-operation/**'
      - 'infrastructure/staging/browser-relay-runner/**'
      - 'infrastructure/staging/browser-relay-trusted-provider-process/**'
      - 'infrastructure/staging/browser-relay-trusted-source-composition/**'
      - 'infrastructure/staging/manifest/**'
      - 'infrastructure/staging/manifest.json'
      - 'infrastructure/staging/manifest-bundle.mjs'
      - 'infrastructure/staging/check.sh'
      - 'infrastructure/staging/validate.mjs'
      - 'infrastructure/staging/test/validate.test.mjs'
      - 'infrastructure/staging/README.md'
      - 'docs/roadmaps/2026-08-29-miakapp-v4-coordination.md'
      - 'docs/specs/2026-08-29-miakapp-v4-design.md'

permissions:
  contents: read

concurrency:
  group: browser-relay-trusted-provider-process-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Browser relay trusted provider process / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEBUG: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate dormant trusted provider process boundary
        run: |
          bash infrastructure/staging/browser-relay-trusted-provider-process/check.sh
          node infrastructure/staging/validate.mjs infrastructure/staging/manifest.json
          git diff --check
