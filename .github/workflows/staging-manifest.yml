name: Staging manifest safety gate

on:
  push:
    branches:
      - main
    paths:
      - '.firebaserc'
      - '.github/workflows/staging-manifest.yml'
      - 'infrastructure/staging/**'
      - 'docs/operations/2026-09-01-miakapp-v4-environments.md'
      - 'control-plane/FAULT-MATRIX.md'
      - 'package.json'
  pull_request:
    paths:
      - '.firebaserc'
      - '.github/workflows/staging-manifest.yml'
      - 'infrastructure/staging/**'
      - 'docs/operations/2026-09-01-miakapp-v4-environments.md'
      - 'control-plane/FAULT-MATRIX.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - name: Validate the credential-free staging intent
        run: npm run test:staging-manifest
