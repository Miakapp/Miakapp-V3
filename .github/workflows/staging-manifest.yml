name: Staging manifest safety gate

# This gate runs `terraform providers lock -platform=darwin_arm64
# -platform=linux_amd64` across eight roots, which downloads both platforms of
# every provider on every run — several gigabytes, and essentially all of the
# job's wall clock. With providers already present the same eight roots finish
# `init`, `validate` and `test` in about twenty seconds.
#
# `terraform providers lock` deliberately ignores the plugin cache directory, so
# caching cannot fix it. The gate is therefore scoped to the changes it can
# actually be affected by, rather than run on every pull request.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/staging-manifest.yml'
      - 'infrastructure/staging/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/staging-manifest.yml'
      - 'infrastructure/staging/**'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

# A superseded push should not leave a half-hour job running to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Staging manifest safety gate / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23
      - name: Install locked browser-attestation dependencies
        run: bun install --frozen-lockfile
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.3
          terraform_wrapper: false
      - name: Validate and mock-plan the credential-free staging foundation
        run: npm run test:staging-manifest
